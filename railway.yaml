apiVersion: v1
kind: Service
metadata:
  name: weather-app-backend
spec:
  ports:
  - port: 5000
  selector:
    app: weather-app-backend
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app-backend
spec:
  selector:
    matchLabels:
      app: weather-app-backend
  template:
    metadata:
      labels:
        app: weather-app-backend
    spec:
      containers:
      - name: weather-app-backend
        image: weather-app-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "5000"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: weather-app-secrets
              key: api-key
        - name: EMAIL_USER
          valueFrom:
            secretKeyRef:
              name: weather-app-secrets
              key: email-user
        - name: EMAIL_PASS
          valueFrom:
            secretKeyRef:
              name: weather-app-secrets
              key: email-pass
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: weather-app-secrets
              key: jwt-secret
